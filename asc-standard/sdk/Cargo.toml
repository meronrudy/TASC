[workspace]
members = ["tasc-sdk", "tasc-sdk-types", "tasc-sdk-cli"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
