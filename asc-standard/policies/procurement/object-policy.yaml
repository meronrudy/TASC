version: 0.1.0
policyPackId: tasc-ga-procurement-objects
policyPackVersion: 0.3.0
requiredObjects:
  - shipmentEligibilityCertificate
  - underwriterConfidencePacket
  - procurementBidPacket
conditionalObjects:
  recyclerIntakePassport:
    requiredLifecycleStages:
      - decommission
      - recycle
trust:
  minimumTrustAnchorLevel: TA2
validity:
  defaultValidityDays: 30
  requireActiveIntervalAtVerification: true
verifierInstructionsTemplate:
  command: "tasc-verify verify --bundle <bundle> --profile <profile> --policy eu-north-star --require-ta TA2 --require-transparency rekor,mirror"
  requiredChecks:
    - CHK_PROCUREMENT_OBJECT_REQUIRED_SET
    - CHK_PROCUREMENT_OBJECT_ARTIFACT_PARITY
    - CHK_PROCUREMENT_OBJECT_INPUT_HASH
    - CHK_PROCUREMENT_OBJECT_BUNDLE_BINDING
    - CHK_PROCUREMENT_OBJECT_SIGNATURE
    - CHK_PROCUREMENT_OBJECT_TRUST_FLOOR
    - CHK_PROCUREMENT_OBJECT_VALIDITY_WINDOW
