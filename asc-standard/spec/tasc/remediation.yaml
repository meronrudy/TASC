  CHK_REPLAY_COMPLETENESS: Populate seeds/build/config/environment/container digests and profile.
  CHK_ATTESTATION_TA2: Provide TA2 attestation meeting trust policy and lifecycle constraints.
  CHK_INCIDENT_WINDOWS_EU: Set incident windows to 15/2/10 and fullPackSlaDays <= 10.
  CHK_TRANSPARENCY_REKOR_PROOF: Regenerate Rekor proof against trusted checkpoint and signature rules.
  CHK_TRANSPARENCY_MIRROR_PROOF: Regenerate mirror proof against trusted checkpoint and signature rules.
  CHK_BADGE_ACTIVE_NOT_REVOKED: Use active badge entry present as active in badge registry.
