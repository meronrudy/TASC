  CHK_SCHEMA_ATTESTATION: Provide complete attestationEvidence payload matching schema requirements.
  CHK_SCHEMA_INCIDENT_INITIAL: Include incidentInitialTemplate with required reporting windows fields.
  CHK_SCHEMA_INCIDENT_PACK: Include incidentPackTemplate with requiredArtifacts and fullPackSlaDays.
  CHK_SCHEMA_TRANSPARENCY_REKOR: Include transparencyProofs.rekor with required proof fields.
  CHK_SCHEMA_TRANSPARENCY_MIRROR: Include transparencyProofs.mirror with required proof fields.
  CHK_SCHEMA_BADGE_ENTRY: Include badgeEntry with badgeId, badgeType, and active status fields.
