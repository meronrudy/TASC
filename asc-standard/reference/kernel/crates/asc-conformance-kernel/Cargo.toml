[package]
name = "asc-conformance-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "replay-drift-validator"
path = "src/main.rs"

[[bin]]
name = "replay-from-log"
path = "src/replay_from_log.rs"

[dependencies]
asc-kernel-runtime = { path = "../asc-kernel-runtime" }
