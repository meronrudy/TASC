version: 0.1.0
default_timezone: UTC
max_age_hours:
  conformance_report: 168
  assurance_pack: 168
  transparency_proof: 24
  revocation_snapshot: 24
  hashlock_manifest: 168
  releasepack_manifest: 24
ordering:
  - spec-hash
  - conformance-report
  - assurance-pack
  - hashlock
  - releasepack
required_lineage:
  - gitCommit
  - specHash
  - conformanceReportDigest
  - assurancePackDigest
  - hashlockDigest
