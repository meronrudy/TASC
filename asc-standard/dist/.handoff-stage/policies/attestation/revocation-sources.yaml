version: 0.1.0
rotation_hours: 24
signing:
  key_path: policies/attestation/pki/ta2-signer.key.pem
  cert_path: policies/attestation/pki/ta2-signer.cert.pem
  algorithm: rsa-sha256
monitored_certificates:
  - id: ta2-signer
    cert_path: policies/attestation/pki/ta2-signer.cert.pem
    issuer_path: policies/attestation/pki/root-ca.cert.pem
crl_sources:
  - id: root-local-crl
    path: policies/attestation/pki/root-ca.crl.pem
    required: false
ocsp_responders:
  - id: local-static-ocsp
    mode: static
    status: good
